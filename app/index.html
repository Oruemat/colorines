<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#cfeafe">
  <title>Colorines</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <section id="home" class="screen active">
    <header class="topbar">
      <h1><span aria-hidden="true">🎨</span> Colorines</h1>
      <button class="btn" id="random" aria-label="Sorpresa">🎲</button>
      <button class="btn" id="gallery-btn" aria-label="Mis dibujos">🖼️</button>
      <button class="btn hold" id="settings-btn" aria-label="Ajustes (mantener pulsado)">⚙️</button>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <div class="cards" id="cards"></div>
  </section>

  <section id="gallery" class="screen">
    <header class="topbar">
      <button class="btn" id="gallery-back" aria-label="Volver">🏠</button>
      <h1><span aria-hidden="true">🖼️</span> Mis dibujos</h1>
    </header>
    <p class="empty" id="gallery-empty" aria-label="Todavía no hay dibujos">📷</p>
    <div class="cards" id="gallery-grid"></div>
  </section>

  <section id="play" class="screen">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas class="paint"></canvas>
        <div class="lines"></div>
        <canvas class="stickers"></canvas>
        <canvas class="fx"></canvas>
        <div class="flash"></div>
      </div>
    </div>
    <aside class="panel">
      <div class="row">
        <button class="btn hold" id="back" aria-label="Volver (mantener pulsado)">🏠</button>
        <button class="btn" id="undo" aria-label="Deshacer">↩️</button>
        <button class="btn" id="clear" aria-label="Borrar todo (doble toque)">🗑️</button>
        <button class="btn" id="photo" aria-label="Guardar en mis dibujos">📷</button>
      </div>
      <div class="row" id="tools"></div>
      <div class="row" id="sizes"></div>
      <div class="swatches" id="swatches"></div>
    </aside>
  </section>

  <div class="overlay" id="viewer" hidden>
    <div class="sheet viewer">
      <div class="viewer-pic" id="viewer-pic"></div>
      <div class="row">
        <button class="btn" id="close-viewer" aria-label="Cerrar">⬅️</button>
        <button class="btn" id="share" aria-label="Compartir">📤</button>
        <button class="btn" id="download" aria-label="Descargar">💾</button>
        <button class="btn" id="delete-art" aria-label="Eliminar (doble toque)">🗑️</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="settings" hidden>
    <div class="sheet">
      <h2>⚙️ Ajustes</h2>
      <button class="opt" id="opt-left">✋ Mano: <b>Derecha</b></button>
      <button class="opt" id="opt-clip">🖍️ No salirse de la zona: <b>Sí</b></button>
      <button class="opt" id="opt-sound">🔊 Sonidos y vibración: <b>Sí</b></button>
      <button class="opt" id="opt-voice">🗣️ Decir nombres de dibujos y colores: <b>Sí</b></button>
      <button class="opt" id="opt-wipe">🧹 Borrar dibujos empezados <small>(doble toque)</small></button>
      <button class="opt" id="close-settings">✅ Listo</button>
    </div>
  </div>

  <script src="js/art.js"></script>
  <script src="js/drawings/granja.js"></script>
  <script src="js/drawings/selva.js"></script>
  <script src="js/drawings/dinosaurios.js"></script>
  <script src="js/drawings/mar.js"></script>
  <script src="js/drawings/vehiculos.js"></script>
  <script src="js/drawings/espacio.js"></script>
  <script src="js/drawings/comida.js"></script>
  <script src="js/drawings/insectos.js"></script>
  <script src="js/drawings/naturaleza.js"></script>
  <script src="js/drawings/juguetes.js"></script>
  <script src="js/drawings/mascotas.js"></script>
  <script src="js/drawings/polo.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
